name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }
      - run: go vet ./...
      # Keep the integration suite compiling even though CI cannot run it.
      - run: go vet -tags=integration ./...
      - run: go test -race ./...
